<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3f94">
<title>ฝากงาน · Fakngan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffc233'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='%2316204a' font-family='sans-serif'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--sf:#fff;--ink:#16204a;--ink2:#58628c;--line:#dde3f1;--navy:#2c3f94;--navy-ink:#fff;--sun:#ffc233;--sun-soft:#fff1c7;--on-sun:#16204a;--ok:#17805f;--bad:#c2344b;--ring:#2c3f94;--r:8px;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1530;--sf:#18214a;--ink:#eef1fc;--ink2:#a3add4;--line:#2b3566;--navy:#8aa2ff;--navy-ink:#0f1530;--sun-soft:#4a3d12;--ok:#47c9a0;--bad:#ff8196;--ring:#ffc233}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Sarabun,'Noto Sans Thai',system-ui,sans-serif}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.boot{padding:64px;text-align:center;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);font:500 15px Prompt,sans-serif;background:var(--navy);color:var(--navy-ink);text-decoration:none;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--bg);filter:none}
.btn.danger{background:var(--bad);color:#fff}.btn.sm{min-height:40px;font-size:14px}.btn.block{width:100%;margin-top:8px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r);color:var(--ink2);flex:none}
.icon:hover{background:var(--bg);color:var(--ink)}.icon.bad:hover{color:var(--bad)}
.field{margin-top:16px}.field label,.lbl{display:block;font:500 14px Prompt,sans-serif;margin-bottom:6px}
.field small,.hint{color:var(--ink2);font:400 13px Sarabun,sans-serif}.hint{display:block;margin-top:6px}
input,select,textarea{width:100%;min-height:44px;font:16px Sarabun,sans-serif;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:2px solid var(--ring);outline-offset:0}
.pw{position:relative}.pw input{padding-right:48px}.pw .icon{position:absolute;right:0;top:0}
.err{min-height:22px;margin-top:12px;color:var(--bad);font-size:14px}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;background:var(--sun-soft);color:var(--ink);display:inline-grid;place-items:center;font:600 calc(var(--s)*.42) Prompt,sans-serif;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
/* auth */
.auth{min-height:100dvh;display:grid;align-content:start}
.auth-brand{padding:32px 24px 8px;text-align:center}.auth-brand img{display:block;width:min(340px,82%);margin:0 auto}
.auth-brand p{color:var(--ink2);max-width:36ch;margin:12px auto 0}
.auth-form{width:100%;max-width:440px;margin:16px auto 40px;padding:8px 24px 24px}
.pickrow{display:flex;align-items:center;gap:16px;margin-top:20px}.pickav{cursor:pointer;line-height:0}
.demo{text-align:center;margin-top:16px}
@media(min-width:900px){.auth{grid-template-columns:1.1fr 1fr;align-items:center;align-content:center}.auth-brand{padding:64px;text-align:left}.auth-brand img{margin:0;width:min(500px,100%)}.auth-brand p{margin:20px 0 0;font-size:18px}.auth-form{background:var(--sf);border:1px solid var(--line);border-radius:12px;margin:24px auto;padding:16px 32px 32px}}
/* shell */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(8px,calc((100% - 1040px)/2 + 16px)) 0 max(16px,calc((100% - 1040px)/2 + 24px));background:var(--sf);border-bottom:1px solid var(--line)}
.brand{font:600 22px Prompt,sans-serif;letter-spacing:-.01em;display:flex;align-items:center;color:var(--navy)}
.brand .w2{background:var(--sun);color:var(--on-sun);padding:0 7px;border-radius:4px;margin-left:3px}
.bar-actions{display:flex;align-items:center;gap:2px}.pbtn{padding:0;margin-left:6px;border-radius:50%;line-height:0}
.shell{max-width:1040px;margin:0 auto}
.rooms{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:9;background:var(--bg);scrollbar-width:none}
.rm{flex:none;min-height:40px;padding:0 14px;border-radius:6px;font:500 15px Prompt,sans-serif;color:var(--ink2)}
.rm:hover{background:var(--line);color:var(--ink)}.rm.on{background:var(--sun);color:var(--on-sun)}
main{padding:8px 12px 96px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 4px 16px}
.head h1{font:600 28px/1.2 Prompt,sans-serif}.meta{color:var(--ink2);font-size:14px;min-height:22px}
.addbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;min-height:48px;border-radius:24px;box-shadow:0 4px 12px rgba(15,21,48,.28)}
@media(min-width:900px){.shell{display:grid;grid-template-columns:184px minmax(0,1fr);gap:32px;padding:24px}.rooms{flex-direction:column;align-self:start;top:calc(80px + env(safe-area-inset-top,0px));padding:0;background:none;overflow:visible}.rm{text-align:left}main{padding:0 0 64px}.head{margin:0 0 16px}.addbtn{position:static;min-height:44px;border-radius:var(--r);box-shadow:none}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:none;min-height:44px;padding:0 12px;font:500 15px Prompt,sans-serif;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--sun)}
.cnt{font:500 12px Prompt,sans-serif;background:var(--line);border-radius:10px;padding:1px 7px;margin-left:4px}
#list{margin-top:12px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r)}
.state{padding:40px 24px;text-align:center;color:var(--ink2)}.state svg{margin-bottom:12px}.state .btn{margin-top:16px}
.sk{height:96px;margin:16px;border-radius:6px;background:var(--line);animation:pl 1.1s ease-in-out infinite alternate}
@keyframes pl{to{opacity:.4}}
/* post */
.post{padding:16px}.post+.post{border-top:1px solid var(--line)}
.pt{display:flex;align-items:center;gap:12px}.pt .who{flex:1;min-width:0}.pt b{display:block;font:500 15px/1.3 Prompt,sans-serif}.pt time,.row-i time{font-size:13px;color:var(--ink2)}
.mr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px}.subj{font-size:13px;color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 12px Prompt,sans-serif;padding:2px 8px;border-radius:4px;background:var(--bg)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun)}.tag.answer::before{background:var(--ok)}
.post h3{font:600 18px/1.4 Prompt,sans-serif;margin:4px 0}
.detail{color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.due{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin-top:6px}.due.late{color:var(--bad);font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.thumbs.one{grid-template-columns:1fr}
.thumb{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);cursor:zoom-in;line-height:0}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover}.one .thumb img{aspect-ratio:auto;max-height:420px;object-fit:contain}
.acts{display:flex;align-items:center;gap:4px;margin:12px -8px -8px}.acts .sp{flex:1}
.act{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:var(--r);font:500 14px Prompt,sans-serif;text-decoration:none}.act:hover{background:var(--bg)}.act.lnk{color:var(--navy)}
/* dialog */
dialog.dlg{border:0;padding:0;background:var(--sf);color:var(--ink);width:100%;max-width:520px;max-height:92dvh;margin:auto 0 0;border-radius:16px 16px 0 0;animation:up .2s ease-out}
dialog.dlg::backdrop{background:rgba(15,21,48,.55)}
@media(min-width:700px){dialog.dlg{margin:auto;border-radius:12px}}
.dlg-in{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-right:-10px}.dh h2{font:600 20px Prompt,sans-serif}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;padding:0;margin:12px 0 0}
.kind span{display:flex;justify-content:center;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:var(--r);font:500 15px Prompt,sans-serif;cursor:pointer}
.kind input:checked+span{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}.kind input:focus-visible+span{outline:2px solid var(--ring);outline-offset:2px}
.kind input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.pics{display:flex;gap:8px;flex-wrap:wrap}.ph{position:relative;width:72px;height:72px}.ph img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.rmv{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--sf);display:grid;place-items:center}
.addp{width:72px;height:72px;border:1px dashed var(--ink2);border-radius:6px;display:grid;place-items:center;color:var(--ink2)}
.rows{margin-top:8px;max-height:46dvh;overflow-y:auto}.row-i{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row-i .grow{flex:1;min-width:0}.row-i b{font:500 15px Prompt,sans-serif}.row-i p{white-space:pre-wrap;word-break:break-word}
.cform{display:flex;gap:8px;margin-top:12px}.stat{display:flex;align-items:center;gap:8px;margin:12px 0;font:500 16px Prompt,sans-serif;color:var(--navy)}
dialog.dlg.chat{height:92dvh}dialog.dlg.chat[open]{display:flex;flex-direction:column}.chat .dlg-in{display:flex;flex-direction:column;flex:1;min-height:0}
@media(min-width:700px){dialog.dlg.chat{height:min(640px,90dvh)}}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--bg);border-radius:12px;padding:6px 12px;word-break:break-word;white-space:pre-wrap}
.bub small{display:block;font:500 12px Prompt,sans-serif;color:var(--ink2)}
.msg.mine .bub{background:var(--navy);color:var(--navy-ink)}.msg.mine .bub small{color:inherit;opacity:.8}
.msg .icon{width:32px;height:32px}
dialog.view{background:none;max-width:100vw;max-height:100dvh;margin:auto;border-radius:0;animation:none;overflow:auto}dialog.view img{display:block;max-width:96vw;max-height:92dvh;margin:auto;border-radius:8px;cursor:zoom-in}dialog.view img.full{max-width:none;max-height:none;cursor:zoom-out}
.vx{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:2;background:rgba(0,0,0,.6);color:#fff;border-radius:50%}.vx:hover{background:rgba(0,0,0,.8);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--sf);padding:10px 16px;border-radius:var(--r);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const LIVE = typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

/* ---------- ฐานข้อมูล: Firebase (Auth + Firestore) หรือ โหมดทดลอง (localStorage) ---------- */
let DB;
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fakngan:' + s)))].map(x => x.toString(16).padStart(2,'0')).join('');
if (LIVE) {
  firebase.initializeApp(FIREBASE_CONFIG);
  const f = firebase.firestore(), au = firebase.auth();
  const emailOf = async id => (await sha(id)).slice(0,24) + '@fakngan.app';
  const profile = async u => {
    const [p,a,b] = await Promise.all([f.collection('users').doc(u.uid).get(), f.collection('admins').doc(u.uid).get(), f.collection('bans').doc(u.uid).get()]);
    const d = p.exists ? p.data() : {};
    return {id:u.uid, name:d.name || 'ผู้ใช้', avatar:d.avatar || '', admin:a.exists, banned:b.exists};
  };
  DB = {
    signup: async (id,name,pw,avatar) => {
      const c = await au.createUserWithEmailAndPassword(await emailOf(id), pw);
      await f.collection('users').doc(c.user.uid).set({name, avatar, created: Date.now()});
      return {id:c.user.uid, name, avatar, admin:false, banned:false};

  if (loaded === 'err') { list.innerHTML = `<div class="state">${ic('note', 36)}<p><b>โหลดโพสต์ไม่ได้</b></p><p>ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง</p><button class="btn ghost" id="retry">ลองใหม่</button></div>`; return; }
  const miss = [...new Set(posts.map(p => p.uid))].filter(u => u && !(u in U));
  if (miss.length) { miss.forEach(u => U[u] = null); DB.getUsers(miss).then(r => { r.forEach(([id, d]) => U[id] = {name: d.name, avatar: d.avatar || ''}); drawPosts(); }).catch(() => {}); }
  const items = posts.filter(p => filter === 'all' || p.type === filter);
  if (!items.length) { list.innerHTML = `<div class="state">${ic('note', 36)}<p><b>${filter === 'all' ? 'ยังไม่มีโพสต์ในห้องนี้' : 'ยังไม่มีโพสต์ในหมวดนี้'}</b></p><p>ฝากงานค้างหรือแจกเฉลยเป็นคนแรกได้เลย</p><button class="btn" data-add>${ic('plus')}ฝากงาน</button></div>`; return; }
  list.innerHTML = items.map(p => {
    const pu = U[p.uid] || {}, nm = pu.name || p.name, ph = pu.name ? pu.avatar : p.avatar, url = safeUrl(p.link), due = p.due ? dueTxt(p.due) : null, imgs = p.images || [];
    return `<article class="post"><div class="pt">${av(ph, nm)}<div class="who"><b>${esc(nm)}</b><time>${ago(p.createdAt)}${p.edited ? ' · แก้ไขแล้ว' : ''}</time></div></div>
      <div class="mr"><span class="tag ${p.type}">${p.type === 'todo' ? 'งานค้าง' : 'เฉลย / งานเสร็จ'}</span><span class="subj">${esc(p.subject)}</span></div>
      <h3>${esc(p.title)}</h3>${p.detail ? `<p class="detail">${esc(p.detail)}</p>` : ''}
      ${due ? `<span class="due ${due.late ? 'late' : ''}">${ic('clock', 14)}${esc(due.txt)}</span>` : ''}
      ${imgs.length ? `<div class="thumbs ${imgs.length === 1 ? 'one' : ''}">${imgs.map((s, i) => `<button class="thumb" data-z="${esc(p.id)}:${i}" aria-label="ดูรูปที่ ${i + 1} ขนาดเต็ม"><img src="${esc(s)}" alt="รูปประกอบ ${i + 1}" loading="lazy"></button>`).join('')}</div>` : ''}
      <div class="acts"><button class="act" data-c="${esc(p.id)}">${ic('chat')}คอมเมนต์</button>${url ? `<a class="act lnk" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${ic('link')}เปิดลิงก์</a>` : ''}<span class="sp"></span>${p.uid === me.id ? `<button class="icon" data-e="${esc(p.id)}" aria-label="แก้ไขโพสต์" title="แก้ไขโพสต์">${ic('edit')}</button>` : ''}
      ${me.admin && p.uid !== me.id ? `<button class="icon bad" data-b="${esc(p.uid)}" data-n="${esc(nm)}" aria-label="แบน ${esc(nm)}" title="แบนผู้ใช้">${ic('ban')}</button>` : ''}
      ${(p.uid === me.id || me.admin) ? `<button class="icon bad" data-d="${esc(p.id)}" aria-label="ลบโพสต์" title="ลบโพสต์">${ic('trash')}</button>` : ''}</div></article>`;
  }).join('');
}

/* ---------- ฟอร์มโพสต์ ---------- */
function composer(ep) {
  let imgs = ep ? [...(ep.images || [])] : [];
  modal(`<form class="dlg-in" novalidate><div class="dh"><h2>${ep ? 'แก้ไขโพสต์' : `ฝากงานให้ ม.3/${room}`}</h2><button type="button" class="icon" data-close aria-label="ปิด">${ic('x')}</button></div>
    <fieldset class="kind"><legend class="sr">ประเภทโพสต์</legend><label><input type="radio" name="t" value="todo" checked><span>งานค้าง</span></label><label><input type="radio" name="t" value="answer"><span>เฉลย / งานเสร็จ</span></label></fieldset>
    <div class="field"><label for="sj">วิชา</label><select id="sj">${SUBJECTS.map(x => `<option>${x}</option>`).join('')}</select></div>
    <div class="field"><label for="ti">หัวข้อ</label><input id="ti" maxlength="80" placeholder="เช่น แบบฝึกหัดบทที่ 3 หน้า 45"></div>
    <div class="field"><label for="de">รายละเอียด <small>(ไม่ใส่ก็ได้)</small></label><textarea id="de" rows="3" maxlength="500"></textarea></div>
    <div class="field"><label for="li">ลิงก์ <small>(ไม่ใส่ก็ได้)</small></label><input id="li" inputmode="url" placeholder="ลิงก์เฉลยหรือไฟล์งาน"></div>
    <div class="field" id="dw"><label for="du">กำหนดส่ง <small>(ไม่ใส่ก็ได้)</small></label><input id="du" type="date"></div>
    <div class="field"><span class="lbl">รูปภาพ <small>(สูงสุด 6 รูป)</small></span><div class="pics" id="pics"></div><input id="imf" type="file" accept="image/*" multiple class="sr" tabindex="-1"></div>
    <p class="err" id="e2" role="alert"></p><button class="btn block" id="ok" type="submit">โพสต์</button></form>`, d => {
    const q = s => d.querySelector(s), type = () => q('[name=t]:checked').value;
    const pics = () => { q('#pics').innerHTML = imgs.map((s, i) => `<div class="ph"><img src="${s}" alt="รูปที่ ${i + 1}"><button type="button" class="rmv" data-i="${i}" aria-label="ลบรูปที่ ${i + 1}">${ic('x', 12)}</button></div>`).join('') + (imgs.length < 6 ? `<button type="button" class="addp" id="addp" aria-label="เพิ่มรูป">${ic('plus', 22)}</button>` : ''); };
    pics();
    q('#pics').onclick = e => { if (e.target.closest('#addp')) q('#imf').click(); const r = e.target.closest('.rmv'); if (r) { imgs.splice(+r.dataset.i, 1); pics(); } };
    q('#imf').onchange = async e => { q('#e2').textContent = ''; for (const f of [...e.target.files].slice(0, 6 - imgs.length)) { try { imgs.push(await fit(f)); } catch(x) { q('#e2').textContent = 'ใช้รูปบางรูปไม่ได้ ลองรูปอื่นนะ'; } } e.target.value = ''; pics(); };
    d.querySelectorAll('[name=t]').forEach(r => r.onchange = () => { q('#dw').hidden = type() !== 'todo'; });
    if (ep) { q('[name=t][value=' + ep.type + ']').checked = true; q('#sj').value = ep.subject; q('#ti').value = ep.title; q('#de').value = ep.detail || ''; q('#li').value = ep.link || ''; q('#du').value = ep.due || ''; q('#dw').hidden = ep.type !== 'todo'; q('#ok').textContent = 'บันทึก'; }
    q('form').onsubmit = async e => {
      e.preventDefault();
      const title = q('#ti').value.trim(), link = q('#li').value.trim();
      if (!title) return q('#e2').textContent = 'ใส่หัวข้อก่อนนะ';
      if (!ep && title === '010010') return secretChat(d);
      if (link && !safeUrl(link)) return q('#e2').textContent = 'ลิงก์ไม่ถูกต้อง';
      const b = q('#ok'); b.disabled = true; b.textContent = 'กำลังโพสต์…';
      const data = {type: type(), subject: q('#sj').value, title, detail: q('#de').value.trim(), link: link ? safeUrl(link) : '', due: type() === 'todo' ? q('#du').value : ''};
      try {
        data.images = await pack(imgs);
        if (ep) { await DB.updatePost(ep.id, {...data, edited: Date.now()}); d.close(); toast('บันทึกการแก้ไขแล้ว'); }
        else { await DB.add({...data, room, uid: me.id, name: me.name, avatar: me.avatar || '', createdAt: Date.now()}); d.close(); toast('โพสต์แล้ว'); }
      }
      catch(x) { q('#e2').textContent = (x && x.code === 'permission-denied') ? 'ทำรายการไม่ได้ บัญชีอาจถูกแบน' : (x && x.code === 'too-big') ? 'รูปมีขนาดใหญ่เกินไป ลองลดจำนวนรูปลง' : 'ไม่สำเร็จ ลองใหม่นะ'; b.disabled = false; b.textContent = ep ? 'บันทึก' : 'โพสต์'; }
    };
  });
}

/* ---------- ห้องลับ ---------- */
function secretChat(d) {
  d.classList.add('chat');
  d.innerHTML = `<div class="dlg-in"><div class="dh"><h2 style="display:flex;align-items:center;gap:8px">${ic('lock', 20)}ห้องลับ</h2><button class="icon" data-close aria-label="ปิด">${ic('x')}</button></div>
    <p class="hint" style="margin-top:0">ทุกคนที่รู้รหัสเข้าห้องนี้ได้ แอดมินดูและลบข้อความได้</p>
    <div class="msgs" id="ms" role="log" aria-live="polite"></div>
    <form class="cform"><input id="mi" maxlength="300" placeholder="พิมพ์ข้อความ…" aria-label="พิมพ์ข้อความ" autocomplete="off"><button class="btn" id="mb" type="submit">ส่ง</button></form><p class="err" id="mer" role="alert"></p></div>`;
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => d.close());
  const q = s => d.querySelector(s); let list = [], first = true;
  const draw = () => {
    const miss = [...new Set(list.map(c => c.uid))].filter(u => u && !(u in U));
    if (miss.length) { miss.forEach(u => U[u] = null); DB.getUsers(miss).then(r => { r.forEach(([id, x]) => U[id] = {name: x.name, avatar: x.avatar || ''}); draw(); }).catch(() => {}); }
    const ms = q('#ms'), stick = first || ms.scrollHeight - ms.scrollTop - ms.clientHeight < 80; first = false;
    ms.innerHTML = list.length ? list.map(c => { const pu = U[c.uid] || {}, nm = pu.name || c.name, mine = c.uid === me.id;
      return `<div class="msg ${mine ? 'mine' : ''}">${mine ? '' : av(pu.name ? pu.avatar : '', nm, 28)}<div class="bub"><small>${esc(nm)} · ${ago(c.createdAt)}</small>${esc(c.text)}</div>${(mine || me.admin) ? `<button class="icon bad" data-x="${esc(c.id)}" aria-label="ลบข้อความ">${ic('trash', 14)}</button>` : ''}</div>`; }).join('') : '<p class="state">ยังไม่มีใครคุย ทักเป็นคนแรกเลย</p>';
    if (stick) ms.scrollTop = ms.scrollHeight;
  };
  const un = DB.chat(l => { list = l.sort((a, b) => a.createdAt - b.createdAt); draw(); });
  d.addEventListener('close', () => un());
  q('#ms').onclick = e => { const x = e.target.closest('[data-x]'); if (x) DB.delChat(x.dataset.x).catch(() => toast('ลบไม่ได้ ลบได้เฉพาะข้อความของตัวเอง')); };
  q('form').onsubmit = async e => {
    e.preventDefault(); const text = q('#mi').value.trim(); if (!text) return;
    q('#mb').disabled = true; q('#mer').textContent = '';
    try { await DB.sendChat({uid: me.id, name: me.name, text, createdAt: Date.now()}); q('#mi').value = ''; }
    catch(x) { q('#mer').textContent = (x && x.code === 'permission-denied') ? 'ส่งไม่ได้ บัญชีอาจถูกแบน' : 'ส่งไม่สำเร็จ ลองใหม่นะ'; }
    q('#mb').disabled = false; q('#mi').focus();
  };
  q('#mi').focus();
}

/* ---------- คอมเมนต์ ---------- */
function commentDlg(p) {
  if (!p) return;
  modal(`<div class="dlg-in"><div class="dh"><h2>ความคิดเห็น</h2><button class="icon" data-close aria-label="ปิด">${ic('x')}</button></div><p class="hint" style="margin-top:0">${esc(p.title)}</p><div id="cl" class="rows"></div>
    <form class="cform"><input id="ci" maxlength="300" placeholder="เขียนคอมเมนต์…" aria-label="เขียนคอมเมนต์" autocomplete="off"><button class="btn" id="cs" type="submit">ส่ง</button></form><p class="err" id="ce" role="alert"></p></div>`, d => {
    const q = s => d.querySelector(s); let list = [];
    const draw = () => {
      const miss = [...new Set(list.map(c => c.uid))].filter(u => u && !(u in U));
      if (miss.length) { miss.forEach(u => U[u] = null); DB.getUsers(miss).then(r => { r.forEach(([id, x]) => U[id] = {name: x.name, avatar: x.avatar || ''}); draw(); }).catch(() => {}); }
      q('#cl').innerHTML = list.length ? list.map(c => { const pu = U[c.uid] || {}, nm = pu.name || c.name;
        return `<div class="row-i">${av(pu.name ? pu.avatar : '', nm, 32)}<div class="grow"><b>${esc(nm)}</b> <time>${ago(c.createdAt)}</time><p>${esc(c.text)}</p></div>${(c.uid === me.id || me.admin) ? `<button class="icon bad" data-x="${esc(c.id)}" aria-label="ลบคอมเมนต์">${ic('trash', 16)}</button>` : ''}</div>`; }).join('') : '<p class="state" style="padding:24px 0">ยังไม่มีคอมเมนต์ เป็นคนแรกเลย</p>';
    };
    const un = DB.comments(p.id, l => { list = l.sort((a, b) => a.createdAt - b.createdAt); draw(); });
    d.addEventListener('close', () => un());
    q('#cl').onclick = async e => { const x = e.target.closest('[data-x]'); if (x && await ask('ลบคอมเมนต์นี้ใช่ไหม?', 'ลบ')) DB.delComment(p.id, x.dataset.x).catch(() => toast('ลบไม่ได้ ลบได้เฉพาะคอมเมนต์ของตัวเอง')); };
    q('form').onsubmit = async e => {
      e.preventDefault(); const text = q('#ci').value.trim(); if (!text) return;
      q('#cs').disabled = true; q('#ce').textContent = '';
      try { await DB.addComment(p.id, {uid: me.id, name: me.name, text, createdAt: Date.now()}); q('#ci').value = ''; q('#cl').scrollTop = q('#cl').scrollHeight; }
      catch(x) { q('#ce').textContent = (x && x.code === 'permission-denied') ? 'ส่งไม่ได้ บัญชีอาจถูกแบน' : 'ส่งไม่สำเร็จ ลองใหม่นะ'; }
      q('#cs').disabled = false;
    };
  });
}

/* ---------- โปรไฟล์ / ฟีดแบ็ค / แอดมิน ---------- */
function profileDlg() {
  let np = me.avatar || '';
  modal(`<form class="dlg-in" novalidate><div class="dh"><h2>โปรไฟล์</h2><button type="button" class="icon" data-close aria-label="ปิด">${ic('x')}</button></div>
    <div class="pickrow"><label class="pickav" for="pf" aria-label="เปลี่ยนรูปโปรไฟล์"><span id="pv"></span></label><label class="btn ghost sm" for="pf">${ic('img')} เปลี่ยนรูป</label><input id="pf" type="file" accept="image/*" class="sr"></div>
    <div class="field"><label for="pn">ชื่อที่แสดง</label><input id="pn" maxlength="20" value="${esc(me.name)}"><small class="hint">ชื่อที่ใช้เข้าสู่ระบบยังเป็นชื่อเดิมตอนสมัคร</small></div>
    <p class="err" id="pe" role="alert"></p><button class="btn block" id="ps" type="submit">บันทึก</button>
    <button class="btn ghost block" type="button" id="lo">ออกจากระบบ</button></form>`, d => {
    const q = s => d.querySelector(s), draw = () => { q('#pv').innerHTML = av(np, me.name, 64); }; draw();
    q('#pf').onchange = async e => { if (e.target.files[0]) { try { np = await shrink(e.target.files[0]); draw(); } catch(x) { q('#pe').textContent = 'ใช้รูปนี้ไม่ได้ ลองรูปอื่นนะ'; } } };
    q('#lo').onclick = () => { d.close(); logout(); };
    q('form').onsubmit = async e => {
      e.preventDefault(); const nm = q('#pn').value.trim(); if (!nm) return q('#pe').textContent = 'ใส่ชื่อก่อนนะ';
      q('#ps').disabled = true;
      try { await DB.updateProfile(me.id, {name: nm, avatar: np}); me = {...me, name: nm, avatar: np}; U[me.id] = {name: nm, avatar: np}; ls.set('fn_me', JSON.stringify(me)); $('#bMe').innerHTML = av(np, nm, 36); drawPosts(); d.close(); toast('บันทึกโปรไฟล์แล้ว'); }
      catch(x) { q('#pe').textContent = (x && x.code === 'permission-denied') ? 'บันทึกไม่ได้ บัญชีอาจถูกแบน' : 'บันทึกไม่สำเร็จ ลองใหม่นะ'; q('#ps').disabled = false; }
    };
  });
}
function feedbackDlg() {
  modal(`<form class="dlg-in" novalidate><div class="dh"><h2>ส่งฟีดแบ็คถึงแอดมิน</h2><button type="button" class="icon" data-close aria-label="ปิด">${ic('x')}</button></div>
    <p class="hint">แจ้งปัญหา เสนอไอเดีย หรือรายงานโพสต์ที่ไม่เหมาะสม แอดมินจะเห็นชื่อของคุณ</p>
    <div class="field"><label for="ft">ข้อความ</label><textarea id="ft" rows="5" maxlength="500"></textarea></div>
    <p class="err" id="fe" role="alert"></p><button class="btn block" id="fs" type="submit">ส่งให้แอดมิน</button></form>`, d => {
    const q = s => d.querySelector(s);
    q('form').onsubmit = async e => {
      e.preventDefault(); const text = q('#ft').value.trim(); if (!text) return q('#fe').textContent = 'พิมพ์ข้อความก่อนนะ';
      q('#fs').disabled = true;
      try { await DB.sendFeedback({uid: me.id, name: me.name, text, createdAt: Date.now()}); d.close(); toast('ส่งให้แอดมินแล้ว ขอบคุณนะ'); }
      catch(x) { q('#fe').textContent = (x && x.code === 'permission-denied') ? 'ส่งไม่ได้ บัญชีอาจถูกแบน' : 'ส่งไม่สำเร็จ ลองใหม่นะ'; q('#fs').disabled = false; }
    };
  });
}
function adminDlg() {
  modal(`<div class="dlg-in"><div class="dh"><h2>แอดมิน</h2><button class="icon" data-close aria-label="ปิด">${ic('x')}</button></div>
    <p class="stat">${ic('users', 20)}<span id="uc">กำลังนับผู้สมัคร…</span></p>
    <div class="tabs" role="tablist"><button role="tab" class="tab" data-t="fb">ฟีดแบ็ค</button><button role="tab" class="tab" data-t="bans">คนที่ถูกแบน</button></div><div id="bl" class="rows"></div></div>`, d => {
    const q = s => d.querySelector(s); let un = () => {};
    DB.usersCount().then(n => { q('#uc').textContent = `ผู้สมัครทั้งหมด ${n} คน`; }).catch(() => { q('#uc').textContent = ''; });
    const show = t => {
      un(); d.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
      un = t === 'fb'
        ? DB.feedbacks(l => { l.sort((a, b) => b.createdAt - a.createdAt); q('#bl').innerHTML = l.length ? l.map(m => `<div class="row-i"><div class="grow"><b>${esc(m.name)}</b> <time>${ago(m.createdAt)}</time><p>${esc(m.text)}</p></div><button class="icon bad" data-f="${esc(m.id)}" aria-label="ลบข้อความ">${ic('trash', 16)}</button></div>`).join('') : '<p class="state" style="padding:24px 0">ยังไม่มีฟีดแบ็ค</p>'; })
        : DB.bans(l => { q('#bl').innerHTML = l.length ? l.map(b => `<div class="row-i"><div class="grow"><b>${esc(b.name)}</b></div><button class="btn ghost sm" data-u="${esc(b.id)}">ปลดแบน</button></div>`).join('') : '<p class="state" style="padding:24px 0">ยังไม่มีใครถูกแบน</p>'; });
    };
    q('.tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) show(b.dataset.t); };
    q('#bl').onclick = async e => { const f = e.target.closest('[data-f]'), u = e.target.closest('[data-u]'); if (u) DB.unban(u.dataset.u); if (f && await ask('ลบข้อความนี้ใช่ไหม?', 'ลบ')) DB.delFeedback(f.dataset.f); };
    d.addEventListener('close', () => un());
    show('fb');
  });
}

DB.restore().then(async u => {
  if (u && u.banned) { await DB.logout(); notice = 'บัญชีนี้ถูกแบน'; mode = 'login'; u = null; }
  me = u; render();
});
</script>
